name: Build Resume PDF

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main
  workflow_dispatch: # Allows manual triggers from the Actions tab

permissions:
  contents: write # Required for deleting and creating releases

jobs:
  build:
    name: Compile LaTeX → PDF
    runs-on: ubuntu-latest

    steps:
      # 1. Checkout the repository code
      - name: Checkout repository
        uses: actions/checkout@v5

      # 2. Setup the self-contained Tectonic compiler
      - name: Setup Tectonic
        uses: wtfjoke/setup-tectonic@v3
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}

      # 3. Pre-process LaTeX documents from JSON data
      - name: Pre-process LaTeX Documents
        run: python scripts/generate_latex.py

      # 4. Compile and rename PDFs
      - name: Compile LaTeX Documents
        run: |
          mkdir -p output
          tectonic resume/source/resume.tex --outdir output
          tectonic resume/source/cover_letter.tex --outdir output
          # The naming rule lives in the pre-processor so the local scripts and
          # CI cannot disagree. It is empty while the name is a placeholder,
          # which keeps the release from advertising a placeholder name.
          STEM=$(python scripts/generate_latex.py --name)
          if [ -n "$STEM" ]; then
            mv output/resume.pdf output/"${STEM}_Resume.pdf"
            mv output/cover_letter.pdf output/"${STEM}_Cover_Letter.pdf"
          fi

      # 5. Fail the build if any document runs past one page
      - name: Assert every document is exactly one page
        run: |
          sudo apt-get update -qq && sudo apt-get install -y -qq poppler-utils
          fail=0
          for f in output/*.pdf; do
            n=$(pdfinfo "$f" | awk '/^Pages:/ {print $2}')
            printf '%-48s %s page(s)\n' "$(basename "$f")" "$n"
            [ "$n" = "1" ] || fail=1
          done
          if [ "$fail" != "0" ]; then
            echo "::error::At least one document is not exactly one page. Cut content rather than shrinking the type."
            exit 1
          fi

      # 6. Upload compiled PDFs as build artifacts
      - name: Upload PDF artifacts
        uses: actions/upload-artifact@v5
        with:
          name: Resume-PDFs
          path: output/*.pdf
          retention-days: 90

      # 7. Delete previous GitHub Release and tag named 'latest'
      - name: Delete old release and tag
        if: github.ref == 'refs/heads/main' && github.event_name == 'push'
        run: gh release delete latest --yes --cleanup-tag
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        continue-on-error: true

      # 8. Create or update the 'latest' release with the newly built PDFs
      - name: Create GitHub Release with PDFs
        if: github.ref == 'refs/heads/main' && github.event_name == 'push'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: latest
          name: "Latest Resume"
          body: |
            Auto-generated PDFs from the latest `main` branch commit, built with Tectonic.

            One page each, in the dense single-column format r/EngineeringResumes
            recommends. The page count is asserted before release.
          files: |
            output/*.pdf
          make_latest: true
