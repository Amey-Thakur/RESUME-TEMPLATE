name: Build Resume PDF

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main
  workflow_dispatch: # Allows manual triggers from the Actions tab

permissions:
  contents: write # Required for deleting and creating releases

jobs:
  build:
    name: Compile LaTeX → PDF
    runs-on: ubuntu-latest

    steps:
      # 1. Checkout the repository code
      - name: Checkout repository
        uses: actions/checkout@v5

      # 2. Setup the self-contained Tectonic compiler
      - name: Setup Tectonic
        uses: wtfjoke/setup-tectonic@v3
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}

      # 3. Pre-process LaTeX documents from JSON data
      - name: Pre-process LaTeX Documents
        run: python scripts/generate_latex.py

      # 4. Compile and rename PDFs
      - name: Compile LaTeX Documents
        run: |
          mkdir -p output
          tectonic resume/source/resume.tex --outdir output
          tectonic resume/source/cover_letter.tex --outdir output
          # The naming rule lives in the pre-processor so the local scripts and
          # CI cannot disagree. It is empty while the name is a placeholder,
          # which keeps the release from advertising a placeholder name.
          STEM=$(python scripts/generate_latex.py --name)
          if [ -n "$STEM" ]; then
            mv output/resume.pdf output/"${STEM}_Resume.pdf"
            mv output/cover_letter.pdf output/"${STEM}_Cover_Letter.pdf"
          fi

      # 5. Upload compiled PDFs as build artifacts
      - name: Upload PDF artifacts
        uses: actions/upload-artifact@v5
        with:
          name: Resume-PDFs
          path: output/*.pdf
          retention-days: 90

      # 6. Delete previous GitHub Release and tag named 'latest'
      - name: Delete old release and tag
        if: github.ref == 'refs/heads/main' && github.event_name == 'push'
        run: gh release delete latest --yes --cleanup-tag
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        continue-on-error: true

      # 7. Create or update the 'latest' release with the newly built PDFs
      - name: Create GitHub Release with PDFs
        if: github.ref == 'refs/heads/main' && github.event_name == 'push'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: latest
          name: "Latest Resume"
          body: |
            Auto-generated resume and cover letter PDFs from the latest `main` branch commit.
            Built from LaTeX source using the Tectonic typesetting engine.
          files: |
            output/*.pdf
          make_latest: true
